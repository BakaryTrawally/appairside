<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Makes mobile display correct -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- App theme color (important for PWA) -->
    <meta name="theme-color" content="#000000" />

    <!-- App description -->
    <meta name="description" content="My React App" />

    <!-- Manifest (IMPORTANT for installable app) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <title>My React App</title>
  </head>

  <body>
    <!-- Shown if JavaScript is disabled -->
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- React injects everything here -->
    <div id="root"></div>
  </body>
</html>
